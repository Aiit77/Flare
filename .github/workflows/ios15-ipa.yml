name: iOS 15 IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios15-ipa-build

permissions:
  contents: read

jobs:
  build-ios15-ipa:
    name: Build unsigned iOS 15 IPA
    # Current replacement packages use Swift tools 5.9 or lower; macOS 15
    # provides a compatible toolchain and avoids the macOS 26 queue backlog.
    runs-on: macos-15
    # Kotlin/Native 需要首次下载并编译多个跨平台模块；首次冷构建可能显著更慢。
    timeout-minutes: 180
    env:
      IPA_NAME: Flare-1.7.4-ios15-unsigned.ipa
      GRADLE_JVM_ARGS: -Xmx6g -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Cache Kotlin Native dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan/dependencies
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Show build tools
        run: |
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec appleApp/project.yml

      - name: Resolve Swift packages
        working-directory: appleApp
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Flare.xcodeproj \
            -scheme iOS

      - name: Archive unsigned device build
        id: archive
        continue-on-error: true
        working-directory: appleApp
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Flare.xcodeproj \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Flare.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            FIREBASE_CRASHLYTICS_UPLOAD_SYMBOLS=NO \
            2>&1 | tee "$RUNNER_TEMP/ios15-build.log"

      - name: Package unsigned IPA
        if: steps.archive.outcome == 'success'
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Flare.xcarchive/Products/Applications/Flare.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
          unzip -t "$IPA_NAME"
          mkdir -p artifacts
          mv "$IPA_NAME" artifacts/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios15-build-log
          path: ${{ runner.temp }}/ios15-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned IPA
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Flare-1.7.4-ios15-unsigned
          path: artifacts/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Mark build failed when archive failed
        if: steps.archive.outcome != 'success'
        run: exit 1
